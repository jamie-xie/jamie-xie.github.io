  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <!-- Generic piece page: site.js reads the slug from the URL and fills
       in the content from pieces.js. To add a piece, copy this folder,
       rename it to the new slug, and add the entry in pieces.js. -->

  <div id="site-header"></div>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Site navigation"></nav>
    <main class="content" id="content"></main>
  </div>

  <script src="../pieces.js"></script>
  <script src="../site.js"></script>
</body>
